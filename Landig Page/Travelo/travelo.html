<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>travelo</title>
    <link rel="stylesheet" href="assets/font-awesome/css/all.min.css" />
    <link rel="stylesheet" href="travelo.css" />
  </head>
  <body>
    <header>
      <!-- navbar -->
      <nav class="navbar">
        <div><img src="image/logo.png" alt="logo" /></div>
        <ul class="nav-menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Destination</a></li>
          <li><a href="#">Pages</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <ul class="nav-icon">
          <li class="phone">
            <span><i class="fa-solid fa-phone"></i>10(256)-928 256</span>
          </li>
          <div class="social-media">
            <li>
              <span><i class="icon fa-brands fa-instagram"></i></span>
            </li>
            <li>
              <span><i class="icon fa-brands fa-linkedin-in"></i></span>
            </li>
            <li>
              <span><i class="icon fa-brands fa-facebook-f"></i></span>
            </li>
            <li>
              <span><i class="icon fa-brands fa-google-plus-g"></i></span>
            </li>
          </div>
        </ul>
        <div>
          <button type="submit" class="search">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
          </button>
        </div>
        <div class="toggler">
          <span><i class="fa-solid fa-bars"></i></span>
        </div>
      </nav>
      <!-- /navbar -->

      <!-- hero-section -->
      <section class="hero-section">
        <h2>Australia</h2>
        <p>Pixel perfect design with awesome contents</p>
        <button type="submit">Explore Now</button>
      </section>
      <!-- /hero-section -->
    </header>
  </body>
</html>
