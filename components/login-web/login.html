<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>Document</title>
  </head>
  <body class="back-ground">
    <div class="login-card">
      <h1 class="title">
        <span class="special-colored-title">Login</span> Your Account
      </h1>

      <form class="input-container">
        <input class="input" type="text" placeholder="Username" required />
        <input class="input" type="email" placeholder="Your email" required />
        <input class="input" type="password" placeholder="Password" required />

        <button type="submit" class="btn">Login</button>
        <div class="footer-link">
          <a href="#" class="forgot-link">Forgot Password?</a>
          <a href="#" class="creat-link">Creat Account</a>
        </div>
      </form>
    </div>
  </body>
</html>
