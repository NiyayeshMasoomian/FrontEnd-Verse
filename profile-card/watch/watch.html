<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALAXY WATCH7</title>
    <link rel="stylesheet" href="watchstyle.css" />
    <link rel="stylesheet" href="assets/font-awesome/css/all.min.css" />
  </head>
  <body>
    <section class="product-card-container">
      <article class="product-card">
        <figure>
          <img src="images/watch.png" alt="Galaxy watch" class="img" />
          <figcaption>
            <a href="" class="product-title">Galaxy Watch7</a>
            <p class="product-desc">
              Power through your day with advanced fitness tracking, heart rate
              monitioring,and a vibrant AMOLED display.
            </p>
          </figcaption>
        </figure>
        <section class="product-card-footer">
          <h4 class="cost">$299</h4>
          <button type="submit" class="btn">
            <span><i class="fa-solid fa-cart-plus icon"></i></span>Add to Cart
          </button>
        </section>
      </article>
    </section>
  </body>
</html>
